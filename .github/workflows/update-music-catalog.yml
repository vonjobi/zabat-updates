name: Update Zabat music catalog

on:
 workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build catalog from Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_TAG: zabat-added
        run: node scripts/build-music-catalog.js
      - name: Commit catalog if changed
        run: |
          if [ -z "$(git status --porcelain -- music-catalog.json)" ]; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-catalog.json
          git commit -m "Update Zabat music catalog"
          git push
